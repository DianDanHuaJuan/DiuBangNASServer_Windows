# 本机 HTTP 代理（Clash / V2RayN 等）。true=开启；false=关闭。
# PowerShell 下载默认不强制走系统代理；开启后 bootstrap 经下方 host:port 拉 GitHub 资源。
# localProxyPort 必须填 HTTP 或 mixed 端口，不要填 SOCKS 端口。
localProxyEnabled=false
localProxyHost=127.0.0.1
localProxyPort=7890

# GitHub 资源镜像前缀（用于 media_kit / FFmpeg release 下载）
# localProxyEnabled=true 时忽略本项，直连 github.com（经本机代理）。
# 推荐：https://ghproxy.net/  （ghfast.top 在部分环境下 SSL 握手失败）
# 其他可选：https://ghfast.top/  |  https://mirror.ghproxy.com/  |  留空直连 GitHub
githubMirrorPrefix=https://ghproxy.net/
